<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="utf-8">
    <title>JídelnaDB</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Jídelní lístek</h1>

    <input id="search" type ="text" placeholder="Hledat jídlo...">

    

    <div id="list" class="hidden"></div>
<h2>Jak jídlo vypadá? <br>Mám si objednat jedničku, nebo dvojku? <br><b>Tento web Vám pomůže rozhodnout!</b></h2>
    <section id="obed-menu" aria-live="polite">
      <h3>Dnes k obědu:</h3>
      <p id="obed-dnes">
        1. -
        2. -
        3. -
      </p>
      <h3>Zítra k obědu:</h3>
      <p id="obed-zitra">
        1. -
        2. -
        3. -
      </p>
    </section>
    <div id="detail" class="hidden">
      <button id="back" type="button">Zpět</button>
      <h2 id="detail-nazev"></h2>
      <img id="detail-img" src="">
      <section id="reviews" aria-live="polite">
        <h3>Recenze</h3>
        <p id="reviews-score">Načítám hodnocení...</p>
        <div id="reviews-list"></div>
        <a id="review-discord" href="#" target="_blank" rel="noopener" class="hidden">
          Přidat recenzi přes Discord
        </a>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/reviews-config.js"></script>
    <script src="js/reviews.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>

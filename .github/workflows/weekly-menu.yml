name: Aktualizovat týdenní jídelníček

on:
  schedule:
    - cron: "0 14 * * 3"
      timezone: "Europe/Prague"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aktualizovat:
    runs-on: ubuntu-latest
    steps:
      - name: Kód
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Závislosti
        run: pip install requests

      - name: Stáhnout jídelníček
        run: python stahni_jidelnicek.py

      - name: Doplnit nové položky pro ruční přiřazení
        run: python priprav_prirazeni.py

      - name: Uložit změny
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jidelnicek.json data/prirazeni-jidel.json
          if ! git diff --cached --quiet; then
            git commit -m "Aktualizuj týdenní jídelníček"
            git push
          fi
